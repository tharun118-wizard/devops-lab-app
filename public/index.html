<!DOCTYPE html>
<html>
<head>
  <title>DevOps Lab App</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      color:white;
      font-family:Arial;
    }

    .card{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      text-align:center;
      width:400px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h1{
      color:#38bdf8;
    }

    p{
      color:#cbd5e1;
      margin:10px 0;
    }

    .label{
      color:#38bdf8;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🚀 DevOps Lab App</h1>

    <p>CI/CD Pipeline Working Successfully</p>

    <p id="health">Loading health...</p>
    <p id="build"></p>
    <p id="time"></p>
  </div>

  <script>
    fetch('/health')
      .then(res => res.json())
      .then(data => {
        document.getElementById("health").innerHTML =
          `<span class="label">Health:</span> ${data.status}`;
      });

    fetch('/info')
      .then(res => res.json())
      .then(data => {
        document.getElementById("build").innerHTML =
          `<span class="label">Build:</span> #${data.build}`;

        document.getElementById("time").innerHTML =
          `<span class="label">Deployed:</span> ${data.deployedAt}`;
      });
  </script>

</body>
</html>
